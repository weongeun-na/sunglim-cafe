<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>성림카페 호출 전광판</title>
    <style>
        body { background: #000; color: #ff0000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; cursor: pointer; }
        .label { font-size: 5vw; color: #fff; margin-bottom: 10px; }
        .number { font-size: 25vw; font-weight: bold; text-shadow: 0 0 40px #ff0000; margin: 0; line-height: 1; }
        .name { font-size: 8vw; color: #ffd700; font-weight: bold; margin-top: 10px; }
        .info { font-size: 3vw; color: #aaa; position: absolute; bottom: 50px; }
        #startOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: white; display: flex; align-items: center; justify-content: center; font-size: 4vw; z-index: 1000; flex-direction: column; cursor: pointer; }
        .pulse-text { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .version-mark { position: absolute; bottom: 10px; right: 10px; color: #555; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="startOverlay" onclick="startSystem()">
        <div class="pulse-text">👆 화면을 한 번 클릭해 주세요! (전체화면 켜기)</div>
    </div>
    <div class="label">준비 완료</div>
    <div id="callNumber" class="number">--</div>
    <div id="callName" class="name">대기중</div>
    
    <div class="info">은혜로운 하루 되세요!</div>
    <div class="version-mark">버전: V22 (사투리 억양 연기 지시 적용)</div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const OPENAI_API_KEY = "sk-proj-inWLEmeAe8y5hrh7T6THxiNnwCKcjIyv-kdM1_4W_QY7xTp-gnEnCd1KnRoX2Oy58w3qFp4DR" + "ET3BlbkFJbpsdJCh_E3LF8dt4JrJsWvWxIGsMI6QW8uLJaUnDCibXseU_r48Xj6hchMiSWHMmThAU0i1O0A";

        var firebaseConfig = {
            apiKey: "AIzaSyAtsMFXTLEmIgew3S_qaZY3m9SbVTnGx7E",
            authDomain: "sunglim-cafe.firebaseapp.com",
            databaseURL: "https://sunglim-cafe-default-rtdb.firebaseio.com",
            projectId: "sunglim-cafe",
            storageBucket: "sunglim-cafe.firebasestorage.app",
            messagingSenderId: "266842911139",
            appId: "1:266842911139:web:8142bf89052e4fa52c6a16"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        let isSystemStarted = false;
        let audioCtx;
        let resetTimer;
        let lastCalledNum = null;
        let lastCalledTime = 0;
        let currentAudio = null;

        function startSystem() {
            document.getElementById('startOverlay').style.display = 'none';
            isSystemStarted = true;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }
        }

        function playChimes() {
            if(!audioCtx) return;
            const type = Math.floor(Math.random() * 5);
            const startTime = audioCtx.currentTime;

            try {
                function playTone(freq, timeOffset, duration, waveType='sine') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = waveType;
                    osc.frequency.setValueAtTime(freq, startTime + timeOffset);
                    gain.gain.setValueAtTime(1.0, startTime + timeOffset);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + timeOffset + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime + timeOffset);
                    osc.stop(startTime + timeOffset + duration);
                }

                if (type === 0) {
                    playTone(659.25, 0, 0.5); playTone(523.25, 0.3, 0.6);
                } else if (type === 1) {
                    playTone(523.25, 0, 0.3); playTone(659.25, 0.2, 0.3); playTone(783.99, 0.4, 0.5);
                } else if (type === 2) {
                    playTone(698.46, 0, 0.4, 'triangle'); playTone(587.33, 0.3, 0.4, 'triangle'); playTone(523.25, 0.6, 0.5, 'triangle');
                } else if (type === 3) {
                    playTone(1046.50, 0, 0.2); playTone(1318.51, 0.15, 0.2); playTone(1567.98, 0.3, 0.4);
                } else if (type === 4) {
                    playTone(659.25, 0, 0.4); playTone(523.25, 0.2, 0.4); playTone(659.25, 0.6, 0.4); playTone(523.25, 0.8, 0.4);
                }
            } catch(e) {}
        }

        function numberToKorean(num) {
            var units = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
            var tens = ['', '십', '이십', '삼십', '사십', '오십', '육십', '칠십', '팔십', '구십'];
            var n = parseInt(num);
            if (isNaN(n) || n === 0) return '영';
            if (n < 10) return units[n];
            if (n < 100) return tens[Math.floor(n / 10)] + units[n % 10];
            return num;
        }

        const normalMentions = [
            "시키신 음료 다 나왔소잉~ 얼른 와서 가져가쇼잉!",
            "주문하신 거 떴응께, 얼른 와서 챙겨가쇼잉~",
            "음료 다 됐당께요! 식기 전에 언능 오쇼잉~",
            "아따, 음료 다 나왔는디~ 언능 오셔서 드셔보쇼잉!",
            "맛나게 타놨응께, 얼른 나와서 가져가쇼잉~"
        ];

        const urgentMentions = [
            "아따~ 아까 불렀는디 안 오시고 뭐 하신당가요! 얼음 다 녹아분께 언능 오쇼잉!",
            "거그 계신 거 다 알고 있소잉! 음료 다 식어분께 빨랑 나와서 가져가쇼잉!",
            "몇 번을 부른당가요~ 바쁘셔도 음료는 챙겨가셔야제! 언능 나오쇼잉!"
        ];

        async function speakWithOpenAI(text, isRepeat) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            try {
                // 연기 지시어 (전라도 사투리 억양과 정감 있는 톤 유도)
                const actingInstruction = isRepeat 
                    ? "구수하고 정감 있는 한국 전라도 사투리 억양으로, 손님을 다정하게 재촉하듯 억양의 높낮이를 살려 활기차게 말해주세요. 표준어 아나운서처럼 딱딱하게 읽지 말고 실제 전라도 토박이 카페 사장님처럼 자연스러운 사투리 톤으로 연기하세요."
                    : "구수하고 정감 있는 한국 전라도 사투리 억양으로, 카페에서 손님을 반갑고 다정하게 부르듯 억양의 높낮이를 살려 말해주세요. 표준어 아나운서처럼 읽지 말고 실제 전라도 토박이처럼 구수한 사투리 톤으로 연기하세요.";

                const response = await fetch("https://api.openai.com/v1/audio/speech", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENAI_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini-tts",
                        voice: "nova",
                        input: text,
                        instructions: actingInstruction,
                        speed: isRepeat ? 1.05 : 1.0
                    })
                });
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                currentAudio = new Audio(url);
                currentAudio.play();
            } catch (e) {
                var fallback = new SpeechSynthesisUtterance(text);
                fallback.lang = 'ko-KR';
                window.speechSynthesis.speak(fallback);
            }
        }

        firebase.database().ref('call').on('value', function(snapshot) {
            var data = snapshot.val();
            if(data && data.num && isSystemStarted) {
                var n = (data.name) ? data.name.trim() : "";
                var t = (data.title) ? data.title.trim() : "";
                var displayName = (n === "") ? t : (n + " " + t);

                document.getElementById('callNumber').innerText = data.num;
                document.getElementById('callName').innerText = displayName;
                
                playChimes();
                
                const now = Date.now();
                const isRepeatCall = (lastCalledNum === data.num) && ((now - lastCalledTime) < 30000);
                lastCalledNum = data.num;
                lastCalledTime = now;

                setTimeout(() => {
                    var kornum = numberToKorean(data.num);
                    var selectedMention = isRepeatCall 
                        ? urgentMentions[Math.floor(Math.random() * urgentMentions.length)]
                        : normalMentions[Math.floor(Math.random() * normalMentions.length)];

                    var namePart = "";
                    if (isRepeatCall) {
                        if (n !== "") {
                            var spelledName = n.split("").join(", ");
                            namePart = (t !== "") ? (spelledName + ", " + t + "!") : (spelledName + "님!");
                        } else {
                            namePart = t + "!";
                        }
                    } else {
                        namePart = displayName + ", " + displayName;
                    }

                    var speakText = kornum + " 번, " + namePart + " " + selectedMention;
                    speakWithOpenAI(speakText, isRepeatCall);
                }, 1800);

                if(resetTimer) clearTimeout(resetTimer);
                resetTimer = setTimeout(() => {
                    document.getElementById('callNumber').innerText = '--';
                    document.getElementById('callName').innerText = '대기중';
                }, 15000); 
            }
        });
    </script>
</body>
</html>
